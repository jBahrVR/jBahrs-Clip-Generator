[pytest]
testpaths = .
python_files = test_*.py
addopts = -v --cov=config_manager --cov=editor --cov=gallery_manager --cov=utils --cov=watcher --cov=video_player --cov=event_bus --cov=subtitle_engine --cov=tracking_engine --cov=queue_manager --cov=social_publisher --cov-report=term-missing --cov-report=xml:coverage.xml
filterwarnings =
    ignore::DeprecationWarning
