name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          pytest

      - name: Download Companion External Binaries
        shell: pwsh
        run: |
          Write-Host "Downloading yt-dlp..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "yt-dlp.exe"
          
          Write-Host "Downloading Deno..."
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "."
          Remove-Item "deno.zip"

          Write-Host "Downloading FFmpeg & FFprobe..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $binFolder = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$binFolder\ffmpeg.exe" -Destination ".\ffmpeg.exe"
          Copy-Item "$binFolder\ffprobe.exe" -Destination ".\ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg_extracted", "ffmpeg.zip"

      - name: Package Release
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.version }}" }
          python package_release.py --version $ver

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/*.zip
            ffmpeg.exe
            ffprobe.exe
            yt-dlp.exe
            deno.exe
          generate_release_notes: true
